<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Ovation — Employee Recognition & Rewards</title>
<meta name="description" content="Ovation — recognize great work, reward your team, and build company culture." />
<meta name="theme-color" content="#6aa6e0" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ovation" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236aa6e0'/%3E%3Cstop offset='1' stop-color='%23a7d3f4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='72' font-family='Arial,sans-serif' font-size='62' font-weight='800' fill='white' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E" />
<style>
/* ============================================================
   OVATION — design system
   Inspired by Apple, Linear, Notion, Stripe.
   ============================================================ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  --r-xs: 10px; --r-sm: 14px; --r-md: 20px; --r-lg: 28px; --r-full: 999px;
  --sp: 4px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  /* brand */
  --brand-1: #5a9bd8; --brand-2: #7db4e8; --brand-3: #a3d0f2;
  --grad: linear-gradient(135deg,#6aa6e0 0%,#89bff0 50%,#a7d3f4 100%);
  --grad-soft: linear-gradient(135deg,rgba(90,155,216,.16),rgba(163,208,242,.12));
}
[data-theme="light"]{
  --bg: #f4f5f9; --bg-2:#eceef4;
  --surface: #ffffff; --surface-2:#fafbfe; --surface-hover:#f4f5fa;
  --text: #0b0d17; --text-2:#5a6072; --text-3:#9aa0b0;
  --border: #e7e9f0; --border-2:#eef0f5;
  --shadow-sm: 0 1px 2px rgba(15,18,40,.05), 0 1px 3px rgba(15,18,40,.05);
  --shadow-md: 0 4px 14px rgba(15,18,40,.06), 0 2px 6px rgba(15,18,40,.04);
  --shadow-lg: 0 18px 50px rgba(20,22,50,.14), 0 6px 18px rgba(20,22,50,.08);
  --green:#16a34a; --green-bg:#e7f7ee; --red:#e11d48; --red-bg:#fdeaef;
  --amber:#d97706; --amber-bg:#fdf2e0; --blue:#2563eb; --blue-bg:#e8f0ff;
}
[data-theme="dark"]{
  --bg:#0a0b12; --bg-2:#0f1119;
  --surface:#14161f; --surface-2:#191c27; --surface-hover:#1d2130;
  --text:#f4f5fa; --text-2:#a6adc0; --text-3:#6c7385;
  --border:#242838; --border-2:#1d2130;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 6px 20px rgba(0,0,0,.5);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.6);
  --green:#34d399; --green-bg:rgba(52,211,153,.12); --red:#fb7185; --red-bg:rgba(251,113,133,.12);
  --amber:#fbbf24; --amber-bg:rgba(251,191,36,.12); --blue:#60a5fa; --blue-bg:rgba(96,165,250,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden; transition:background .4s var(--ease), color .4s var(--ease);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
::selection{background:rgba(110,168,232,.28)}

/* ---------- App layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;height:100dvh}
.sidebar{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;gap:6px;position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 18px}
.brand .logo{
  width:36px;height:36px;border-radius:11px;background:var(--grad);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;
  box-shadow:0 6px 16px rgba(110,168,232,.4);flex-shrink:0;
}
.brand .name{font-weight:750;font-size:19px;letter-spacing:-.03em}
.brand .name b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.nav-label{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);padding:14px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);
  color:var(--text-2);font-weight:550;font-size:14.5px;width:100%;text-align:left;
  transition:.18s var(--ease);position:relative;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:var(--surface-hover);color:var(--text)}
.nav-item.active{background:var(--grad-soft);color:var(--brand-1)}
[data-theme="dark"] .nav-item.active{color:#93c5fd}
.nav-item.active svg{opacity:1}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px}

.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
.profile-mini{display:flex;align-items:center;gap:11px;padding:8px;border-radius:var(--r-sm);transition:.18s;width:100%}
.profile-mini:hover{background:var(--surface-hover)}
.profile-mini .meta{text-align:left;overflow:hidden}
.profile-mini .meta .n{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-mini .meta .r{font-size:12px;color:var(--text-3)}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:64px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;gap:14px;padding:0 24px;position:relative;z-index:15;
}
.topbar .page-title{font-size:20px;font-weight:750;letter-spacing:-.02em}
.topbar .page-sub{font-size:13px;color:var(--text-3);margin-top:1px}
.spacer{flex:1}
.icon-btn{
  width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);
  transition:.18s var(--ease);position:relative;
}
.icon-btn:hover{background:var(--surface-hover);color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--red);border-radius:99px;border:2px solid var(--surface)}
.role-switch{display:flex;background:var(--bg-2);border-radius:var(--r-full);padding:3px;gap:2px}
.role-switch button{padding:7px 15px;border-radius:var(--r-full);font-size:13px;font-weight:600;color:var(--text-2);transition:.2s var(--ease)}
.role-switch button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

.content{flex:1;overflow-y:auto;padding:26px 24px 60px;scroll-behavior:smooth}
.view{max-width:1180px;margin:0 auto;animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Reusable ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-sm)}
.grid{display:grid;gap:18px}
.stat-grid{grid-template-columns:repeat(4,1fr)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 15px}
.section-head h2{font-size:17px;font-weight:750;letter-spacing:-.02em}
.section-head .link{font-size:13px;font-weight:600;color:var(--brand-1)}
[data-theme="dark"] .section-head .link{color:#93c5fd}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-full);font-size:12px;font-weight:650}
.pill.green{background:var(--green-bg);color:var(--green)} .pill.red{background:var(--red-bg);color:var(--red)}
.pill.amber{background:var(--amber-bg);color:var(--amber)} .pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.brand{background:var(--grad-soft);color:var(--brand-2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--r-sm);
  font-weight:650;font-size:14px;transition:.18s var(--ease);white-space:nowrap;
}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(90,155,216,.35)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(90,155,216,.45)}
.btn.primary:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{background:var(--surface-hover);border-color:var(--text-3)}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff}

.avatar{border-radius:var(--r-full);display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0;background:var(--grad);overflow:hidden;position:relative}
.avatar.ring{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand-2)}

/* ---------- Stat card ---------- */
.stat{padding:20px}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.stat .ic svg{width:21px;height:21px}
.stat .val{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:14px;font-variant-numeric:tabular-nums}
.stat .lab{font-size:13.5px;color:var(--text-2);margin-top:2px;font-weight:500}

/* ---------- Hero profile ---------- */
.hero{padding:0;overflow:hidden}
.hero .banner{height:96px;background:var(--grad);position:relative}
.hero .banner::after{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 20% 120%,rgba(255,255,255,.28),transparent 45%),
  radial-gradient(circle at 85% -20%,rgba(255,255,255,.22),transparent 45%)}
.hero .body{padding:0 26px 24px;margin-top:-42px;position:relative}
.hero .av{width:88px;height:88px;font-size:32px;border:4px solid var(--surface);box-shadow:var(--shadow-md)}
.hero .row1{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px}
.hero h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:14px}
.hero .sub{color:var(--text-2);font-size:14px;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .sub .dotsep{width:3px;height:3px;border-radius:99px;background:var(--text-3)}
.level-chip{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 16px}
.level-chip .lvl{width:44px;height:44px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.level-chip .txt .a{font-size:12px;color:var(--text-3);font-weight:600}
.level-chip .txt .b{font-weight:750;font-size:15px}

/* XP bar */
.xpbar{margin-top:20px}
.xpbar .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px}
.xpbar .lab b{color:var(--text)} .xpbar .lab span{color:var(--text-3)}
.track{height:10px;background:var(--bg-2);border-radius:99px;overflow:hidden}
.track .fill{height:100%;background:var(--grad);border-radius:99px;width:0;transition:width 1.1s var(--ease)}
[data-theme="dark"] .track{background:#0a0b12}

/* Badges */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.badge-cell{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:15px 8px;text-align:center;transition:.2s var(--ease);cursor:default}
.badge-cell:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--brand-2)}
.badge-cell.locked{opacity:.4;filter:grayscale(.6)}
.badge-cell .emo{font-size:30px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.badge-cell .bn{font-size:11.5px;font-weight:650;margin-top:8px;line-height:1.25}
.badge-cell .bd{font-size:10.5px;color:var(--text-3);margin-top:2px}

/* Goals */
.goal{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.goal .g-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.goal .g-title{font-weight:650;font-size:14.5px}
.goal .g-meta{font-size:12.5px;color:var(--text-3);margin-top:2px}
.goal .g-prog{display:flex;align-items:center;gap:11px}
.goal .track{flex:1}
.goal .pct{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}

/* Streak */
.streak-row{display:flex;gap:7px;margin-top:14px}
.streak-day{flex:1;aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:650;background:var(--surface-2);border:1px solid var(--border);color:var(--text-3)}
.streak-day.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(90,155,216,.3)}
.streak-day.today{outline:2px solid var(--brand-2);outline-offset:2px}

/* ---------- Feed ---------- */
.feed{display:flex;flex-direction:column;gap:16px;max-width:660px;margin:0 auto}
.composer{padding:16px 18px}
.composer .row{display:flex;gap:12px;align-items:center}
.composer input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-full);padding:12px 18px;font-size:14px;color:var(--text);outline:none;transition:.2s}
.composer input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(110,168,232,.14)}
.post{padding:18px 20px;animation:pop .45s var(--ease-spring) both}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.post .p-head{display:flex;gap:12px;align-items:center}
.post .p-head .av{width:44px;height:44px;font-size:16px}
.post .p-who{font-weight:700;font-size:14.5px}
.post .p-time{font-size:12.5px;color:var(--text-3)}
.post .p-body{margin:13px 0 4px;font-size:14.5px;line-height:1.55;color:var(--text)}
.post .p-body .hl{font-weight:700}
.award-chip{display:inline-flex;align-items:center;gap:6px;background:var(--grad-soft);color:var(--brand-2);font-weight:750;padding:3px 11px;border-radius:var(--r-full);font-size:13px}
.p-behavior{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 13px;font-size:13px;font-weight:600;margin-top:10px}
.p-actions{display:flex;gap:6px;margin-top:14px;padding-top:13px;border-top:1px solid var(--border-2)}
.react-btn{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-full);font-size:13px;font-weight:600;color:var(--text-2);transition:.16s var(--ease)}
.react-btn:hover{background:var(--surface-hover)}
.react-btn.on{color:var(--brand-1);background:var(--grad-soft)}
[data-theme="dark"] .react-btn.on{color:#93c5fd}
.react-btn svg{width:17px;height:17px}
.react-btn .pop{display:inline-block;transition:transform .3s var(--ease-spring)}
.react-btn.on .pop{transform:scale(1.25)}

/* ---------- Rewards ---------- */
.reward-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:8px}
.balance-card{display:flex;align-items:center;gap:16px;padding:18px 22px;background:var(--grad);border-radius:var(--r-md);color:#fff;box-shadow:0 12px 30px rgba(90,155,216,.4)}
.balance-card .big{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.balance-card .lbl{font-size:12.5px;opacity:.85;font-weight:600;letter-spacing:.02em}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;margin-bottom:4px}
.chip{padding:8px 15px;border-radius:var(--r-full);font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);white-space:nowrap;transition:.16s}
.chip:hover{border-color:var(--text-3)}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.reward-grid{grid-template-columns:repeat(3,1fr)}
.reward{overflow:hidden;display:flex;flex-direction:column;transition:.22s var(--ease)}
.reward:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.reward .thumb{height:120px;display:grid;place-items:center;font-size:46px;position:relative}
.reward .thumb .stock{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px;backdrop-filter:blur(4px)}
.reward .r-body{padding:15px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
.reward .r-name{font-weight:700;font-size:14.5px}
.reward .r-desc{font-size:12.5px;color:var(--text-3);line-height:1.4;flex:1}
.reward .r-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.reward .cost{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px}
.reward .cost .coin{color:var(--amber)}

/* ---------- Leaderboard ---------- */
.lb-tabs{display:flex;gap:6px;margin-bottom:16px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-bottom:20px}
.pod{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 12px;text-align:center;box-shadow:var(--shadow-sm);position:relative}
.pod .rank-medal{font-size:26px;margin-bottom:4px}
.pod .av{margin:0 auto 10px}
.pod.p1{background:linear-gradient(180deg,rgba(251,191,36,.14),var(--surface));border-color:rgba(251,191,36,.4)}
.pod.p1 .av{width:64px;height:64px;font-size:23px}
.pod.p2 .av,.pod.p3 .av{width:52px;height:52px;font-size:19px}
.pod .pn{font-weight:700;font-size:14px}
.pod .pp{font-weight:800;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
.pod .pp small{color:var(--text-3);font-weight:600;font-size:11px}
.lb-list{overflow:hidden}
.lb-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border-2);transition:.15s}
.lb-row:last-child{border-bottom:none}
.lb-row:hover{background:var(--surface-hover)}
.lb-row.me{background:var(--grad-soft)}
.lb-row .rk{font-weight:750;font-size:15px;width:26px;color:var(--text-3);font-variant-numeric:tabular-nums}
.lb-row .av{width:42px;height:42px;font-size:15px}
.lb-row .who{flex:1;min-width:0}
.lb-row .who .n{font-weight:650;font-size:14.5px}
.lb-row .who .d{font-size:12.5px;color:var(--text-3)}
.lb-row .pts{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.lb-row .delta{font-size:12px;font-weight:700;margin-left:2px}

/* ---------- Manager award ---------- */
.award-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
.people-list{max-height:none}
.person-row{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:var(--r-sm);transition:.15s;cursor:pointer;border:1.5px solid transparent}
.person-row:hover{background:var(--surface-hover)}
.person-row.sel{background:var(--grad-soft);border-color:var(--brand-2)}
.person-row .av{width:40px;height:40px;font-size:14px}
.person-row .info{flex:1;min-width:0}
.person-row .info .n{font-weight:650;font-size:14px}
.person-row .info .d{font-size:12px;color:var(--text-3)}
.person-row .chk{width:22px;height:22px;border-radius:99px;border:2px solid var(--border);display:grid;place-items:center;transition:.15s}
.person-row.sel .chk{background:var(--brand-1);border-color:var(--brand-1)}
.person-row .chk svg{width:13px;height:13px;color:#fff;opacity:0;transition:.15s}
.person-row.sel .chk svg{opacity:1}
.behavior-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.beh{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface-2);transition:.16s;text-align:left}
.beh:hover{border-color:var(--brand-2);transform:translateY(-1px)}
.beh.sel{border-color:var(--brand-1);background:var(--grad-soft)}
.beh .emo{font-size:22px}
.beh .bt{font-weight:650;font-size:13.5px;line-height:1.2}
.beh .bp{font-size:12px;font-weight:800;margin-left:auto;color:var(--green)}
.beh .bp.neg{color:var(--red)}
textarea.note{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;font-family:inherit;font-size:14px;color:var(--text);resize:vertical;min-height:70px;outline:none;transition:.2s}
textarea.note:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(110,168,232,.14)}

.chart-card{padding:20px}
.chart-card .ch-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.chart-card h3{font-size:15px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:44px;background:var(--grad);border-radius:8px 8px 4px 4px;transition:height 1s var(--ease);position:relative}
.bar:hover::after{content:attr(data-v);position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.bar-lab{font-size:11.5px;color:var(--text-3);font-weight:600}
.donut-wrap{display:flex;align-items:center;gap:22px}
.legend{display:flex;flex-direction:column;gap:10px;flex:1}
.legend .lg{display:flex;align-items:center;gap:9px;font-size:13px}
.legend .lg .sw{width:11px;height:11px;border-radius:4px}
.legend .lg .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.dept-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--border-2)}
.dept-row:last-child{border:none}
.dept-row .dn{width:110px;font-size:13.5px;font-weight:600}
.dept-row .track{flex:1}
.dept-row .dv{font-weight:700;font-size:13px;width:52px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Notifications drawer ---------- */
.drawer-scrim{position:fixed;inset:0;background:rgba(10,12,25,.4);opacity:0;pointer-events:none;transition:.3s;z-index:90;backdrop-filter:blur(2px)}
.drawer-scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;background:var(--surface);border-left:1px solid var(--border);z-index:100;transform:translateX(100%);transition:.36s var(--ease);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.open{transform:none}
.drawer .d-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.drawer .d-head h3{font-size:17px;font-weight:750}
.drawer .d-body{flex:1;overflow-y:auto;padding:8px}
.notif{display:flex;gap:12px;padding:13px;border-radius:var(--r-sm);transition:.15s;position:relative}
.notif:hover{background:var(--surface-hover)}
.notif.unread::before{content:"";position:absolute;left:4px;top:50%;transform:translateY(-50%);width:6px;height:6px;background:var(--brand-1);border-radius:99px}
.notif .n-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.notif .n-txt{font-size:13.5px;line-height:1.45}
.notif .n-txt b{font-weight:700}
.notif .n-time{font-size:11.5px;color:var(--text-3);margin-top:3px}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{display:flex;align-items:center;gap:12px;background:var(--text);color:var(--bg);padding:13px 18px;border-radius:var(--r-full);font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);animation:toastIn .45s var(--ease-spring) both}
.toast .t-ic{width:26px;height:26px;border-radius:99px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:14px}
@keyframes toastIn{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-16px) scale(.94)}}

/* Confetti */
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:250;pointer-events:none;border-radius:2px}

/* ---------- Modal ---------- */
.modal-scrim{position:fixed;inset:0;background:rgba(10,12,25,.5);backdrop-filter:blur(4px);z-index:150;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.28s;padding:20px}
.modal-scrim.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);width:420px;max-width:100%;padding:28px;box-shadow:var(--shadow-lg);transform:scale(.94) translateY(10px);transition:.32s var(--ease-spring)}
.modal-scrim.open .modal{transform:none}
.modal .m-emo{font-size:52px;text-align:center;line-height:1}
.modal h2{font-size:21px;font-weight:800;text-align:center;margin-top:14px;letter-spacing:-.02em}
.modal p{text-align:center;color:var(--text-2);font-size:14px;margin-top:8px;line-height:1.5}

/* Mobile nav */
.mobile-nav{display:none}

/* ---------- Responsive ---------- */
@media(max-width:1080px){

  .reward-grid{grid-template-columns:repeat(2,1fr)}

}

  .hero h1{font-size:21px}
  .drawer{width:100%}
}
@media(max-width:420px){.reward-grid{grid-template-columns:1fr}.badge-grid{grid-template-columns:repeat(3,1fr)}}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.two-col.wide{grid-template-columns:1.5fr 1fr}

function postCard(p,idx){

  }

function commentThread(p){
  if(!openComments.has(p.id))return '';
  const list=(p.comments||[]).map(cm=>`
    <div style="display:flex;gap:10px;margin-top:12px">
      <div class="avatar" style="width:32px;height:32px;font-size:12px;background:${cm.color}">${cm.av}</div>

        ${cm.gif?`<div style="font-size:34px;line-height:1.1;margin-top:2px">${cm.gif}</div>`:''}
      </div>
    </div>`).join('');
  return `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border-2)">
    ${list}
    <div id="gifs-${p.id}" style="display:none;flex-wrap:wrap;gap:6px;margin-top:12px">

    </div>
    <div style="display:flex;gap:9px;align-items:center;margin-top:12px">
      <div class="avatar" style="width:32px;height:32px;font-size:12px;background:var(--grad)">JD</div>
      <input id="ci-${p.id}" placeholder="Add a comment…" onkeydown="if(event.key==='Enter'){addComment('${p.id}',this.value,'')}" style="flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-full);padding:9px 15px;font-size:13.5px;color:var(--text);outline:none"/>
      <button class="icon-btn" title="Add a GIF" onclick="const g=document.getElementById('gifs-${p.id}');g.style.display=g.style.display==='none'?'flex':'none'" style="width:36px;height:36px;font-weight:800;font-size:12px;border:1px solid var(--border)">GIF</button>
      <button class="btn primary sm" onclick="addComment('${p.id}',document.getElementById('ci-${p.id}').value,'')">Post</button>
    </div>
  </div>`;
}
function toggleComments(id){openComments.has(id)?openComments.delete(id):openComments.add(id);rerenderFeed();}
function addComment(id,text,gif){
  const p=feed.find(x=>x.id===id);if(!p)return;
  if(!p.comments)p.comments=[];
  text=(text||'').trim();
  if(!text&&!gif)return;
  p.comments.push({who:'Jordan Diaz',av:'JD',color:'var(--grad)',body:text,gif:gif||''});
  openComments.add(id);rerenderFeed();
}
function rerenderFeed(){
  if(state.view==='feed')renderFeed($('#view'));
  else render();
}
function celebrate(btn){btn.classList.add('on');burst(btn);const s=btn.querySelector('span:last-child');s.textContent='Celebrated';}
function badgeEmojiFor(beh){const b=behaviors.find(x=>beh.toLowerCase().includes(x.t.toLowerCase().split(' ')[0]));return b?b.emo:'✨'}
function react(idx,type,btn){
  const p=feed[idx];
  if(type==='like'){p.liked=!p.liked;p.likes+=p.liked?1:-1;}
  else{p.clapped=!p.clapped;p.claps+=p.clapped?1:-1; if(p.clapped)burst(btn);}
  btn.classList.toggle('on');
  btn.querySelector('span:last-child').textContent=type==='like'?p.likes:p.claps;
}
function postRecognition(){
  const inp=$('#composerInput');const txt=inp.value.trim();if(!txt){inp.focus();return;}
  const give=25;
  if(state.giveBalance<give){toast('⚠️','Not enough points to give this month');return;}
  state.giveBalance-=give;
  feed.unshift({id:'n'+Date.now(),who:'Jordan Diaz',av:'JD',color:'var(--grad)',t:'just now',pts:give,beh:'Helped a teammate',value:state.selValue,body:txt,likes:0,claps:0,liked:false,clapped:false,comments:[]});
  renderFeed($('#view'));confettiBurst();toast('🎉',`Recognition posted · +${give} pts · #${state.selValue.replace(/ /g,'')}`);
}

// ---------- Live branding ----------
function _hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function lighten(hex,amt){const [r,g,b]=_hx(hex);const m=v=>Math.round(v+(255-v)*amt);return `#${[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}`;}
function hexA(hex,a){const [r,g,b]=_hx(hex);return `rgba(${r},${g},${b},${a})`;}
function applyBrand(color){
  const s=document.documentElement.style;const c2=lighten(color,.14),c3=lighten(color,.30);
  s.setProperty('--brand-1',color);s.setProperty('--brand-2',c2);s.setProperty('--brand-3',c3);
  s.setProperty('--grad',`linear-gradient(135deg,${color} 0%,${c2} 50%,${c3} 100%)`);
  s.setProperty('--grad-soft',`linear-gradient(135deg,${hexA(color,.16)},${hexA(c3,.12)})`);
  const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute('content',color);
}
function setBrand(c){state.company.color=c;applyBrand(c);if(state.view==='settings')render();toast('🎨','Brand color updated');}
function setCompanyName(name){
  state.company.name=name||'Ovation';
  const bn=$('#brandName');if(bn)bn.innerHTML=name?name.replace(/</g,'&lt;'):'Ov<b>ation</b>';
  if(!state.company.logo){const lp=$('#logoPreview');if(lp)lp.textContent=(name[0]||'O').toUpperCase();const bl=$('#brandLogo');if(bl&&!state.company.logo)bl.textContent=(name[0]||'O').toUpperCase();}
}
function uploadLogo(ev){

  const rd=new FileReader();

    const set=(id)=>{const el2=$('#'+id);if(el2){el2.style.backgroundImage=`url(${e.target.result})`;el2.textContent='';}};

  };
  rd.readAsDataURL(f);
}

// ---------- Toast + confetti ----------
let toastTimer;
function toast(ic,msg){
  const t=el('div','toast',`<span class="t-ic">${ic}</span>${msg}`);
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{t.style.animation='toastOut .4s var(--ease) forwards';setTimeout(()=>t.remove(),400)},2600);
}
function burst(anchor){
  const rect=anchor.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const p=el('div','confetti');const col=['#6366f1','#ec4899','#f59e0b','#10b981'][i%4];
    p.style.cssText=`position:fixed;left:${rect.left+rect.width/2}px;top:${rect.top}px;width:7px;height:7px;background:${col};border-radius:2px;z-index:250;pointer-events:none`;
    document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2,dist=30+Math.random()*40;
    p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist-10}px) scale(0)`,opacity:0}],{duration:600,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}
function confettiBurst(){
  const colors=['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6'];
  for(let i=0;i<70;i++){
    const c=el('div','confetti');
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    const dur=1400+Math.random()*1200,drift=(Math.random()-.5)*220;
    c.animate([{transform:`translate(0,0) rotate(0)`,opacity:1},{transform:`translate(${drift}px,${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:.9}],{duration:dur,easing:'cubic-bezier(.3,.6,.4,1)'}).onfinish=()=>c.remove();
  }
}

// ---------- Animate progress bars ----------
function animateBars(){
  $$('.track .fill[data-w]').forEach(f=>{const w=f.dataset.w;f.style.width='0%';requestAnimationFrame(()=>{setTimeout(()=>f.style.width=w+'%',60)})});
  $$('.bar[data-h]').forEach(b=>{const h=b.dataset.h;b.style.height='0%';requestAnimationFrame(()=>{setTimeout(()=>b.style.height=h+'%',60)})});
}

// ---------- Theme ----------
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',next);
  $('#themeBtn').innerHTML=next==='light'?I.moon:I.sun;
}
